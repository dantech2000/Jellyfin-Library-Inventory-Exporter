name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # One build per Jellyfin line: net9.0 for 10.11, net10.0 for 12.0.
      - name: Publish
        run: |
          for tfm in net9.0 net10.0; do
            dotnet publish ./Jellyfin.Plugin.LibraryInventoryExporter/Jellyfin.Plugin.LibraryInventoryExporter.csproj \
              --configuration Release --framework "$tfm" --no-restore --output "./dist/publish/$tfm"
          done

      - name: Package
        run: |
          python3 tools/package_plugin.py dist/publish/net9.0 dist/packages
          python3 tools/package_plugin.py dist/publish/net10.0 dist/packages

      # Each zip must carry the build.yaml guid and its own Jellyfin line's targetAbi.
      - name: Check packages
        run: |
          set -- dist/packages/*.10.zip; python3 tools/check_package.py build.yaml "$1" 10.11.0.0
          set -- dist/packages/*.12.zip; python3 tools/check_package.py build.yaml "$1" 12.0.0.0

  e2e:
    name: E2E (Jellyfin ${{ matrix.jellyfin }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ["10.11", "12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Docker + Playwright suite
        run: ./e2e/run.sh ${{ matrix.jellyfin }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-jellyfin-${{ matrix.jellyfin }}
          path: |
            e2e/playwright-report/${{ matrix.jellyfin }}
            e2e/test-results/${{ matrix.jellyfin }}
          retention-days: 14
