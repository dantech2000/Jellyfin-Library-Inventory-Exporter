<!DOCTYPE html>
<html>
<head>
    <title>Library Inventory Exporter</title>
    <style>
        .libraryPicker {
            margin-top: 1em;
        }

        .libraryList {
            display: flex;
            flex-direction: column;
            gap: .5em;
            margin-top: .75em;
        }

        .libraryOption.checkboxContainer {
            margin: 0;
        }

        .outputDirectoryOptions {
            display: flex;
            flex-wrap: wrap;
            gap: .5em;
            margin-top: .75em;
        }

        .outputDirectoryOption {
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .exportProgress {
            margin: 1em 0;
        }

        .exportProgressHeader {
            align-items: center;
            display: flex;
            justify-content: space-between;
            gap: 1em;
            margin-bottom: .5em;
        }

        .exportProgressStage,
        .exportProgressPercent {
            font-weight: 600;
        }

        .exportProgressBar {
            background: rgba(255, 255, 255, .18);
            border-radius: 4px;
            height: .75em;
            overflow: hidden;
        }

        .exportProgressFill {
            background: #00a4dc;
            height: 100%;
            min-width: 0;
            transition: width .2s ease;
            width: 0;
        }

        .exportProgressDetails {
            margin-top: .5em;
        }

        .inventoryExporterAlert {
            background: rgba(203, 39, 42, .15);
            border-left: 4px solid #cb272a;
            border-radius: 4px;
            margin: 1em 0;
            padding: .75em 1em;
            white-space: pre-line;
        }

        .inventoryExporterWarning {
            background: rgba(245, 166, 35, .15);
            border-left-color: #f5a623;
        }
    </style>
</head>
<body>
    <div id="LibraryInventoryExporterConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="LibraryInventoryExporterConfigForm">
                    <div class="inputContainer">
                        <input is="emby-input" type="text" id="txtOutputDirectory" label="Output directory" />
                        <div class="fieldDescription" id="outputDirectoryHelp"></div>
                        <div id="outputDirectoryOptions" class="outputDirectoryOptions"></div>
                        <div id="outputDirectoryWarning" class="inventoryExporterAlert inventoryExporterWarning" role="status" hidden></div>
                    </div>
                    <label class="checkboxContainer">
                        <input is="emby-checkbox" type="checkbox" id="chkCsv" />
                        <span>CSV by default</span>
                    </label>
                    <label class="checkboxContainer">
                        <input is="emby-checkbox" type="checkbox" id="chkJson" />
                        <span>JSON by default</span>
                    </label>
                    <label class="checkboxContainer">
                        <input is="emby-checkbox" type="checkbox" id="chkStreams" />
                        <span>Include media streams</span>
                    </label>
                    <label class="checkboxContainer">
                        <input is="emby-checkbox" type="checkbox" id="chkProviders" />
                        <span>Include provider IDs</span>
                    </label>
                    <label class="checkboxContainer">
                        <input is="emby-checkbox" type="checkbox" id="chkUserData" />
                        <span>Include user watch state</span>
                    </label>
                    <div class="inputContainer libraryPicker">
                        <div class="fieldDescription">Libraries</div>
                        <label class="checkboxContainer">
                            <input is="emby-checkbox" type="checkbox" id="chkAllLibraries" checked />
                            <span>All libraries</span>
                        </label>
                        <div id="libraryList" class="libraryList"></div>
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" type="number" id="txtRetentionCount" label="Retention count" min="0" />
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" type="number" id="txtRetentionDays" label="Retention days" min="0" />
                    </div>
                    <button is="emby-button" type="submit" class="raised button-submit block">
                        <span>Save</span>
                    </button>
                </form>

                <div class="verticalSection">
                    <div id="inventoryExporterError" class="inventoryExporterAlert" role="alert" hidden></div>
                    <button is="emby-button" id="btnRunExport" class="raised block">
                        <span>Run Export Now</span>
                    </button>
                    <button is="emby-button" id="btnDownloadLatest" class="raised block">
                        <span>Download Latest Export</span>
                    </button>
                    <div id="exportProgress" class="exportProgress" hidden>
                        <div class="exportProgressHeader">
                            <span id="exportProgressStage" class="exportProgressStage">Idle</span>
                            <span id="exportProgressPercent" class="exportProgressPercent">0%</span>
                        </div>
                        <div class="exportProgressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <div id="exportProgressFill" class="exportProgressFill"></div>
                        </div>
                        <div id="exportProgressDetails" class="fieldDescription exportProgressDetails"></div>
                    </div>
                    <h2>Recent exports</h2>
                    <div id="exportStatus"></div>
                    <div id="exportHistory"></div>
                </div>
            </div>
        </div>
        <script src="configurationpage?name=LibraryInventoryExporterJs"></script>
    </div>
</body>
</html>
